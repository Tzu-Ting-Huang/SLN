<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COUNT CALCULATOR - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f7f9; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        input[type="number"], input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; background-color: #3498db; color: white; padding: 14px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; transition: background 0.3s; margin-bottom: 10px; }
        .btn:hover { background-color: #2980b9; }
        .btn-record { background-color: #27ae60; margin-top: 10px; }
        .btn-record:hover { background-color: #219150; }
        .btn-excel { background-color: #27ae60; width: auto; font-size: 14px; padding: 10px 20px; }
        
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 350px; text-align: center; }
        
        #resultSection { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; background-color: #f8fbfe; border: 2px solid #3498db; }
        .result-main { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .result-card { flex: 1; min-width: 180px; text-align: center; }
        .val-display { display: block; font-size: 1.5em; font-weight: 700; margin-top: 5px; }
        .predict-color { color: #2ecc71; } 
        .lower-color { color: #e67e22; }  
        .result-label { color:#7f8c8d; font-size:0.9em; font-weight:bold; }

        .record-zone { border-top: 1px dashed #ccc; padding-top: 20px; margin-top: 10px; }
 
        .history-section { margin-top: 40px; border-top: 2px solid #eee; padding-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; }
        .btn-del { background: #e74c3c; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
        .user-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #eef2f7; padding: 10px 20px; border-radius: 6px; }
        .chart-container { position: relative; height: 350px; width: 100%; margin-top: 30px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h3>User Login</h3>
        <p>Please enter your account name</p>
        <input type="text" id="loginUser" placeholder="Account Name" style="margin-bottom: 20px;">
        <button class="btn" onclick="login()">Login</button>
    </div>
</div>

<div class="container" id="mainContent" style="display:none;">
    <div class="user-info">
        <span>Current User: <strong id="currentUserDisplay"></strong></span>
        <button onclick="logout()" style="cursor:pointer; border:none; background:none; color:#3498db; text-decoration:underline;">Logout</button>
    </div>

    <h2>COUNT CALCULATOR</h2>

    <div class="form-group">
        <label>CHART_NO: <span style="font-weight:normal; color:#7f8c8d;">(8 digits only)</span></label>
        <input type="text" id="chartNo" placeholder="e.g. 12345678" maxlength="8">
    </div>

    <div class="form-group">
        <label>Mapping Max Value: <span style="font-weight:normal; color:#7f8c8d;">(102 - 74800)</span></label>
        <input type="number" id="maxValue" placeholder="Between 102 and 74800" step="any">
    </div>

    <div style="display: flex; gap: 15px;">
        <div class="form-group" style="flex: 1;">
            <label>Duration:</label>
            <select id="opTime">
                 <option value="1" selected>Next day (1)</option>
                 <option value="0">Same day (0)</option>
            </select>
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Machine:</label>
            <select id="machineType">
                 <option value="1">New (1)</option>
                 <option value="0" selected>Old (0)</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Regression / CI Mode:</label>
        <select id="mode">
            <option value="97.5" selected>97.5% CI</option>
            <option value="95">95% CI</option>
            <option value="92.5">92.5% CI</option>
            <option value="90">90% CI</option>
            <option value="quantile">Quantile</option>
        </select>
    </div>

    <button id="calcBtn" class="btn" onclick="performCalculation()">Calculate Prediction</button>

    <div id="resultSection">
        <div class="result-main">
            <div class="result-card">
                <span class="result-label">PREDICTED VALUE</span>
                <span id="meanVal" class="val-display predict-color">-</span>
            </div>
            <div class="result-card">
                <span id="lowerLabel" class="result-label">LOWER LIMIT</span>
                <span id="lowerVal" class="val-display lower-color">-</span>
            </div>
        </div>

        <div class="record-zone">
            <div class="form-group">
                <label>2. Enter Actual Observed Count:</label>
                <input type="text" id="actualCount" placeholder="Enter value to save record">
            </div>
            <button class="btn btn-record" onclick="saveToHistory()">Confirm & Record</button>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="regressionChart"></canvas>
    </div>

    <div class="history-section">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h3>Calculation History</h3>
            <button class="btn btn-excel" onclick="exportToExcel()">Export to Excel</button>
        </div>
        <div style="overflow-x:auto;">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>User</th>
                        <th>CHART_NO</th>
                        <th>Mapping</th>
                        <th>Machine</th>
                        <th>Duration</th>
                        <th>Predict</th>
                        <th>Lower</th>
                        <th>Actual</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    Chart.register(ChartDataLabels);
    let myChart = null;
    let currentUser = "";
    let currentCalculation = null; // 暫存目前的計算結果

    function login() {
        const user = document.getElementById('loginUser').value.trim();
        if(!user) { alert("Please enter account name"); return; }
        currentUser = user;
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        document.getElementById('currentUserDisplay').innerText = currentUser;
        loadHistory();
    }

    function logout() { location.reload(); }

    // 第一階段：計算
    function performCalculation() {
        const chartNo = document.getElementById('chartNo').value.trim();
        const V = parseFloat(document.getElementById('maxValue').value);
        const T = parseFloat(document.getElementById('opTime').value);
        const M = parseFloat(document.getElementById('machineType').value);
        const mode = document.getElementById('mode').value;

        if (!/^\d{8}$/.test(chartNo)) { alert("CHART_NO must be 8 digits."); return; }
        if (isNaN(V) || V < 102 || V > 74800) { alert("Invalid Mapping Value (102-74800)"); return; }

        const lnV = Math.log(V);
        const getLower = (z) => Math.exp(1.96017 + lnV * 0.91657 + (T * -0.94008) + (M * 0.24254) - (z * 0.65491));
        const predMean = Math.exp(1.96017 + lnV * 0.91657 + (T * -0.94008) + (M * 0.24254));
        const qMean = Math.exp(1.9584 + 0.9347 * lnV + (-1.023 * T) + 0.1833 * M);
        const qLower = Math.exp(0.5404 + 0.9266 * lnV + (-0.6611 * T) + 0.4296 * M);

        let finalMean, finalLower, labelText;
        if (mode === "quantile") {
            finalMean = Math.round(qMean); finalLower = Math.round(qLower);
            labelText = "QUANTILE LOWER LIMIT:";
        } else {
            finalMean = Math.round(predMean);
            const zScores = {"97.5": 1.96, "95": 1.645, "92.5": 1.44, "90": 1.28};
            finalLower = Math.round(getLower(zScores[mode]));
            labelText = mode + "% CI LOWER LIMIT:";
        }

        // 顯示結果
        document.getElementById('resultSection').style.display = 'block';
        document.getElementById('meanVal').innerText = finalMean.toLocaleString();
        document.getElementById('lowerVal').innerText = finalLower.toLocaleString();
        document.getElementById('lowerLabel').innerText = labelText;

        // 更新圖表
        const labels = ['90% CI', '92.5% CI', '95% CI', '97.5% CI', 'Quantile'];
        const meanData = [Math.round(predMean), Math.round(predMean), Math.round(predMean), Math.round(predMean), Math.round(qMean)];
        const lowerData = [Math.round(getLower(1.28)), Math.round(getLower(1.44)), Math.round(getLower(1.645)), Math.round(getLower(1.96)), Math.round(qLower)];
        updateChart(labels, meanData, lowerData, mode);

        // 暫存計算數據以供後續存檔
        currentCalculation = {
            chartNo, V, T, M, finalMean, finalLower
        };
        
        // 捲動到輸入框
        document.getElementById('actualCount').focus();
    }

    // 第二階段：輸入 Actual 並存檔
    function saveToHistory() {
        if (!currentCalculation) { alert("Please calculate first."); return; }
        
        const actual = document.getElementById('actualCount').value.trim();
        if (!/^\d+$/.test(actual) || parseInt(actual) <= 0) {
            alert("Actual Observed Count must be a positive integer.");
            return;
        }

        const record = {
            date: new Date().toLocaleString(),
            user: currentUser,
            chartNo: currentCalculation.chartNo,
            mapping: currentCalculation.V,
            machine: currentCalculation.M == 1 ? "New" : "Old",
            duration: currentCalculation.T == 1 ? "Next day" : "Same day",
            predict: currentCalculation.finalMean,
            lower: currentCalculation.finalLower,
            actual: actual
        };

        let history = JSON.parse(localStorage.getItem('calc_history') || "[]");
        history.unshift(record);
        localStorage.setItem('calc_history', JSON.stringify(history));
        
        loadHistory();
        alert("Record Saved!");
        
        // 清除輸入框以便下一次使用
        document.getElementById('actualCount').value = "";
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem('calc_history') || "[]");
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = "";

        history.forEach((item, index) => {
            const tr = document.createElement('tr');
            const delBtn = item.user === currentUser 
                ? `<button class="btn-del" onclick="deleteRecord(${index})">Delete</button>` 
                : `<span style="color:#ccc">Locked</span>`;

            tr.innerHTML = `
                <td>${item.date}</td>
                <td>${item.user}</td>
                <td>${item.chartNo}</td>
                <td>${item.mapping}</td>
                <td>${item.machine}</td>
                <td>${item.duration}</td>
                <td>${item.predict}</td>
                <td>${item.lower}</td>
                <td>${item.actual}</td>
                <td>${delBtn}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteRecord(index) {
        let history = JSON.parse(localStorage.getItem('calc_history') || "[]");
        if(confirm("Delete this record?")) {
            history.splice(index, 1);
            localStorage.setItem('calc_history', JSON.stringify(history));
            loadHistory();
        }
    }

    function exportToExcel() {
        const history = JSON.parse(localStorage.getItem('calc_history') || "[]");
        if(history.length === 0) { alert("No data"); return; }
        const worksheet = XLSX.utils.json_to_sheet(history);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "History");
        XLSX.writeFile(workbook, `History_${new Date().getTime()}.xlsx`);
    }

    function updateChart(labels, meanData, lowerData, currentMode) {
        const ctx = document.getElementById('regressionChart').getContext('2d');
        const isSelected = (l) => (l.includes(currentMode) || (currentMode==='quantile' && l==='Quantile'));
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Predicted Value',
                        data: meanData,
                        borderColor: '#2ecc71',
                        borderWidth: 2,
                        fill: false,
                        tension: 0,
                        datalabels: { align: 'top' }
                    },
                    {
                        label: 'Lower Limit',
                        data: lowerData,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        pointBackgroundColor: labels.map(l => isSelected(l) ? '#e67e22' : '#3498db'),
                        pointRadius: labels.map(l => isSelected(l) ? 8 : 4),
                        fill: true,
                        tension: 0.3,
                        datalabels: { align: 'bottom' }
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    datalabels: { formatter: (value) => value.toLocaleString(), display: true },
                    legend: { position: 'bottom' }
                }
            }
        });
    }
</script>

</body>
</html>
