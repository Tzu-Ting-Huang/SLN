<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COUNT CALCULATOR</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f7f9; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        input[type="number"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; background-color: #3498db; color: white; padding: 14px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; transition: background 0.3s; margin-bottom: 20px; }
        .btn:hover { background-color: #2980b9; }
        
        #result { 
            margin-top: 25px; 
            padding: 15px; 
            border-radius: 8px; 
            display: none; 
            background-color: #f8fbfe; 
            border: 1px solid #d1e3f8;
            text-align: center;
        }
        .result-main { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; }
        .result-card { flex: 1; min-width: 150px; padding: 5px; }
        
        /* 數值再次縮小，設定為更平衡的 1.6em */
        .val-display { 
            display: block; 
            font-size: 0.8em; 
            font-weight: 700; 
            margin: 2px 0; 
        }
        .predict-color { color: #2ecc71; } 
        .lower-color { color: #e67e22; }   
        
        .chart-container { position: relative; height: 400px; width: 100%; margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h2>COUNT CALCULATOR</h2>
    
    <div class="form-group">
        <label>Mapping Max Value: <span style="font-weight:normal; color:#7f8c8d;">(102 - 74800)</span></label>
        <input type="number" id="maxValue" placeholder=" Please enter a value between 102 and 74800" step="any" min="102" max="74800">
    </div>

    <div style="display: flex; gap: 15px;">
        <div class="form-group" style="flex: 1;">
            <label>Duration:</label>
            <select id="opTime">
                <option value="1" selected>Next day (1)</option>
                <option value="0">Same day (0)</option>
            </select>
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Machine:</label>
            <select id="machineType">
                <option value="1">New (1)</option>
                <option value="0" selected>Old (0)</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Regression / CI Mode:</label>
        <select id="mode">
            <option value="97.5" selected>97.5% CI</option>
            <option value="95">95% CI</option>
            <option value="92.5">92.5% CI</option>
            <option value="90">90% CI</option>
            <option value="quantile">Quantile</option>
        </select>
    </div>

    <button id="calcBtn" class="btn" onclick="calculate()">Calculate</button>

    <div id="result">
        <div class="result-main">
            <div class="result-card">
                <div style="color:#7f8c8d; font-size:0.8em; font-weight:bold;">PREDICTED VALUE</div>
                <span id="meanVal" class="val-display predict-color">-</span>
            </div>
            <div class="result-card">
                <div id="lowerLabel" style="color:#7f8c8d; font-size:0.8em; font-weight:bold;">LOWER LIMIT</div>
                <span id="lowerVal" class="val-display lower-color">-</span>
            </div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="regressionChart"></canvas>
    </div>
</div>

<script>
    Chart.register(ChartDataLabels);
    let myChart = null;

    function calculate() {
        const V = parseFloat(document.getElementById('maxValue').value);
        const T = parseFloat(document.getElementById('opTime').value);
        const M = parseFloat(document.getElementById('machineType').value);
        const mode = document.getElementById('mode').value;

        if (isNaN(V) || V < 102 || V > 74800) {
            alert("Please enter a valid value (102 - 74800)");
            return;
        }

        const lnV = Math.log(V);
        const getLower = (z) => Math.exp(1.96017 + lnV * 0.91657 + (T * -0.94008) + (M * 0.24254) - (z * 0.65491));
        const predMean = Math.exp(1.96017 + lnV * 0.91657 + (T * -0.94008) + (M * 0.24254));
        const qMean = Math.exp(1.9584 + 0.9347 * lnV + (-1.023 * T) + 0.1833 * M);
        const qLower = Math.exp(0.5404 + 0.9266 * lnV + (-0.6611 * T) + 0.4296 * M);

        let finalMean, finalLower;
        if (mode === "quantile") {
            finalMean = Math.round(qMean); finalLower = Math.round(qLower);
            document.getElementById('lowerLabel').innerText = "QUANTILE LOWER LIMIT";
        } else {
            finalMean = Math.round(predMean);
            const zScores = {"97.5": 1.96, "95": 1.645, "92.5": 1.44, "90": 1.28};
            finalLower = Math.round(getLower(zScores[mode]));
            document.getElementById('lowerLabel').innerText = mode + "% CI LOWER LIMIT";
        }

        document.getElementById('result').style.display = 'block';
        document.getElementById('meanVal').innerText = finalMean.toLocaleString();
        document.getElementById('lowerVal').innerText = finalLower.toLocaleString();

        const labels = ['90% CI', '92.5% CI', '95% CI', '97.5% CI', 'Quantile'];
        const meanData = [Math.round(predMean), Math.round(predMean), Math.round(predMean), Math.round(predMean), Math.round(qMean)];
        const lowerData = [Math.round(getLower(1.28)), Math.round(getLower(1.44)), Math.round(getLower(1.645)), Math.round(getLower(1.96)), Math.round(qLower)];

        updateChart(labels, meanData, lowerData, mode);
    }

    function updateChart(labels, meanData, lowerData, currentMode) {
        const ctx = document.getElementById('regressionChart').getContext('2d');
        const isSelected = (l) => (l.includes(currentMode) || (currentMode==='quantile' && l==='Quantile'));

        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Predicted Value',
                        data: meanData,
                        borderColor: '#2ecc71',
                        borderWidth: 3,
                        pointRadius: 5,
                        fill: false,
                        tension: 0,
                        datalabels: { align: 'top', offset: 5, color: '#27ae60', font: { weight: 'bold', size: 11 } }
                    },
                    {
                        label: 'Lower Limit',
                        data: lowerData,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        pointBackgroundColor: labels.map(l => isSelected(l) ? '#e67e22' : '#3498db'),
                        pointRadius: labels.map(l => isSelected(l) ? 8 : 5),
                        fill: true,
                        tension: 0.3,
                        datalabels: { align: 'bottom', offset: 10, color: '#2980b9', font: { weight: 'bold', size: 11 } }
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    datalabels: {
                        formatter: (value) => value.toLocaleString(),
                        display: true
                    },
                    legend: { position: 'bottom', labels: { boxWidth: 12 } }
                },
                scales: {
                    y: { 
                        beginAtZero: false,
                        grace: '15%', 
                        ticks: { callback: v => v.toLocaleString(), font: { size: 10 } }
                    },
                    x: { ticks: { font: { size: 11 } } }
                }
            }
        });
    }
</script>

</body>
</html>
